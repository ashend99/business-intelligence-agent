routing:
  accounts_path: "/me/accounts"
  insights_path: "/{ig_user_id}/insights"
  chart_insights_path: "/{ig_user_id}/insights"
  media_path: "/{ig_user_id}/media"

accounts:
  fields: "id,name,instagram_business_account{id,username,profile_picture_url,followers_count,follows_count,media_count}"

metrics:
  reach:
    name: "reach"
    period: "day"
    window_days: 28
  views:
    name: "views"
    period: "day"
    window_days: 28
  total_interactions:
    name: "total_interactions"
    period: "day"
    window_days: 28
  accounts_engaged:
    name: "accounts_engaged"
    period: "day"
    window_days: 28
  follows_and_unfollows:
    name: "follows_and_unfollows"
    period: "day"
    window_days: 28
  profile_links_taps:
    name: "profile_links_taps"
    period: "day"
    window_days: 28

posts:
  media_fields: "id,caption,media_type,timestamp,thumbnail_url,media_url,permalink,insights.metric(reach,total_interactions)"
  default_limit: 10
